name: Release

# Pushing a tag like v0.1.0 builds everything, publishes a GitHub Release
# with zips, the launcher setup exe and auto-written notes, and pushes the server image.
# The "Cut release" workflow makes the tag and starts this one on it (workflow_dispatch).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/export.yml
    with:
      retention-days: 7

  tags:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      image-tags: ${{ steps.tags.outputs.image-tags }}
      prerelease: ${{ steps.tags.outputs.prerelease }}
    steps:
      - id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            echo "image-tags=$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "image-tags=$version ${version%.*} latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  server-image:
    needs: [export, tags]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-image.yml
    with:
      version: ${{ needs.export.outputs.version }}
      tags: ${{ needs.tags.outputs.image-tags }}

  launcher:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: Stamp the launcher version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: python ../tools/ci/launcher_release.py stamp $env:TAG.TrimStart("v")

      # Signed with TAURI_SIGNING_PRIVATE_KEY so installed launchers can update themselves.
      # Without the secret the setup exe still ships, but launchers do not self-update to it.
      - name: Build the setup exe
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx -y @tauri-apps/cli@2.12.6 build --bundles nsis
          } else {
            Write-Output "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: installed launchers will not update to this release"
            npx -y @tauri-apps/cli@2.12.6 build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Name the setup files
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "dist/Fenlight-Setup-$version.exe"
          if (Test-Path "$($setup.FullName).sig") { Copy-Item "$($setup.FullName).sig" "dist/Fenlight-Setup-$version.exe.sig" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-setup
          path: launcher/dist/*
          retention-days: 7

  publish:
    needs: [export, tags, server-image, launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: Fenlight-*
          path: artifacts

      - name: Zip builds
        run: |
          mkdir dist
          chmod +x artifacts/*/*.x86_64
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -qr9 "$GITHUB_WORKSPACE/dist/$name.zip" .)
          done
          ls -la dist

      - name: Download the launcher setup
        uses: actions/download-artifact@v4
        with:
          name: launcher-setup
          path: dist

      - uses: actions/checkout@v4
        with:
          path: source

      - name: Write the launcher update manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sig="dist/Fenlight-Setup-$version.exe.sig"
          if [ -f "$sig" ]; then
            python3 source/tools/ci/launcher_release.py manifest --version "$version" \
              --setup-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Fenlight-Setup-$version.exe" \
              --signature-file "$sig" --out dist/latest.json
          fi
          ls -la dist

      # Player notes: docs/release-notes/<tag>.md, if the tag has one, goes above the PR list.
      # The channel always comes from the tag, also for a release made in the GitHub UI:
      # stable is the latest full release, a test build is a pre-release that never becomes latest.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.export.outputs.version }}
          PRERELEASE: ${{ needs.tags.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            channel=(--prerelease --latest=false)
          else
            channel=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${channel[@]}"
            exit 0
          fi
          flags=(--repo "$GITHUB_REPOSITORY" --title "Fenlight $VERSION" --generate-notes --verify-tag)
          notes="source/docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then flags+=(--notes-file "$notes"); fi
          gh release create "$TAG" dist/* "${flags[@]}" "${channel[@]}"
