name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GDTOOLKIT_VERSION: 4.5.0
  RUFF_VERSION: 0.17.5

jobs:
  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}" "ruff==${RUFF_VERSION}" "pillow==12.3.0" "numpy==2.5.3"

      - name: Test quality checks
        run: python -m unittest discover -s tools/ci -p "test_*.py"

      - name: Whole-repo lint, format, complexity, tests-required and review-recorded check
        env:
          NO_TESTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-tests-needed') }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          args="origin/${{ github.base_ref }}"
          if [ "$NO_TESTS_LABEL" = "true" ]; then args="$args --no-tests-label"; fi
          # Read the PR live, so a re-run sees an edited body. Drafts skip the review rule.
          draft=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ] && [ "$draft" != "false" ]; then echo "Could not read the PR draft state"; exit 1; fi
          if [ "$draft" = "false" ]; then
            gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/pr_body.md"
            args="$args --pr-body-file $RUNNER_TEMP/pr_body.md"
          fi
          python tools/ci/check_pr.py $args

      - name: Structure rules
        run: python tools/ci/check_rules.py

      - name: Skills copies match (.agents/skills = .claude/skills)
        run: python tools/ci/check_skills_mirror.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Boot test
        run: |
          ./godot --headless --path . --quit-after 300 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error" boot.log; then exit 1; fi

      - name: GUT tests
        run: |
          set -o pipefail
          ./godot --headless --path . -s addons/gut/gut_cmdln.gd 2>&1 | tee gut.log
          if grep -E "SCRIPT ERROR|Parse Error" gut.log; then exit 1; fi
